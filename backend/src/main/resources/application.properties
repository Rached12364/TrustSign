spring.application.name=trustsign
server.port=8081

# --- Base de données : H2 en fichier (aucune installation). Voir application-postgres.properties pour PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/trustsign;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Stockage des PDF (originaux et versions signées)
trustsign.storage.dir=./data/files
trustsign.demo.load=true

# --- Sécurité : changez ce secret en production (au moins 32 caractères) ou utilisez TRUSTSIGN_JWT_SECRET
trustsign.jwt.secret=${TRUSTSIGN_JWT_SECRET:change-me-trustsign-demo-secret-0123456789}
trustsign.jwt.ttl-minutes=120

# --- Infrastructure à clés publiques (PKI) de démonstration
# Autorité de certification interne + un certificat X.509 par signataire, dans des magasins PKCS#12.
trustsign.pki.dir=./data/pki
trustsign.pki.password=${TRUSTSIGN_PKI_PASSWORD:change-me-pki}
trustsign.pki.location=Tunis
